# Sovereign Workbench - default deployment (Laptop A).
#
# Network layout (Task 1):
#   LAN  --HTTPS :443-->  Nginx (frontend container, host network)  --HTTP-->  127.0.0.1:8000 backend
#   Port 80 only redirects to 443. The backend binds to loopback, so http://<LAN_IP>:8000 is closed.
#
# The frontend uses normal port mapping for Docker Desktop/Windows compatibility. The backend
# reaches host-hosted Ollama through host.docker.internal and is published only on localhost.
#
# Before the first start:  ./scripts/gen_tls_cert.sh <LAN_IP>   (no IP = local mode, https://localhost)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sovereign-backend
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # All model settings, inference endpoints, credentials, and custom flags
    # are loaded directly from backend/.env. To change the LLM model, simply
    # update LLM_MODEL in backend/.env — no edits to docker-compose.yml needed.
    env_file:
      - ./backend/.env
    environment:
      # Bind inside the container; the published host port is restricted to loopback below.
      - HOST=0.0.0.0
      - PORT=8000
      - RUNNING_IN_DOCKER=true
      # Exact CORS allow-list; SERVER_LAN_IP is written to ./.env by scripts/gen_tls_cert.sh.
      - SERVER_LAN_IP=${SERVER_LAN_IP:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
      # --- Encryption layer defaults (can be overridden in backend/.env) ---
      - ENCRYPTION_DATA_DIR=/data
      - HE_CONTEXT_FILE=/data/he/he_context.enc
      - HE_POLY_MODULUS_DEGREE=8192
      - HE_COEFF_MOD_BIT_LENGTHS=[60, 40, 40, 60]
      - HE_THREADS=1
      - DIFFERENTIAL_PRIVACY_ENABLED=true
      - DP_EPSILON=5000
      - DP_DELTA=1e-5
      - EMBED_MODEL=nomic-embed-text
      # --- Code sandbox: reached only through this Unix socket (no TCP, no shared network) ---
      - SANDBOX_SOCKET=/ipc/runner.sock
    volumes:
      # Named volume, not a file bind-mount: binding a host file that does not exist yet
      # makes Docker create a *directory* at that path and context loading fails.
      - sovereign-crypto:/data
      # Shared only with sandbox-runner. The backend gets the runner's socket, NOT the Docker socket.
      - sandbox-ipc:/ipc
    # RAM-backed /tmp: OCR writes short-lived plaintext page images and PDF copies there
    # (pdf2image, pytesseract). tmpfs keeps them off disk and they vanish on container stop.
    tmpfs:
      - /tmp:size=512m
    restart: unless-stopped

  # The ONLY service with the Docker socket (root-equivalent on rootful Docker: docs/SANDBOX.md).
  # No network at all and no ports: reachable only via /ipc/runner.sock in the sandbox-ipc volume.
  sandbox-runner:
    build:
      context: ./sandbox-runner
      dockerfile: Dockerfile
    container_name: sovereign-sandbox-runner
    network_mode: none
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox-ipc:/ipc
    environment:
      - SANDBOX_IMAGE=python:3.11-slim
      - SANDBOX_MAX_CONCURRENT=2
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Relative: the browser calls https://<this host>/api/..., proxied by Nginx.
        - VITE_API_URL=/api
    container_name: sovereign-frontend
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      # Only the server cert + key, read-only. The CA key (certs/ca/ca.key) is never mounted.
      - ./certs/server:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  # Holds the sealed CKKS context, the ciphertext vault and the audit log.
  # Back it up together with ENCRYPTION_MASTER_KEY (stored separately).
  sovereign-crypto:
  # Holds only runner.sock: the backend <-> sandbox-runner channel.
  sandbox-ipc:
