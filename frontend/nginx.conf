# TLS front door for the workbench (Task 1).
#
# The container runs with network_mode: host (see docker-compose.yml), so it listens on the
# host's :80 and :443 directly and reaches the backend at 127.0.0.1:8000. The backend binds to
# loopback only, so it is not reachable from the LAN; this server is the only way in.
#
# Certificates come from scripts/gen_tls_cert.sh and are bind-mounted read-only at
# /etc/nginx/certs (never baked into the image).

server_tokens off;

# Port 80: no content, only a redirect to HTTPS.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS 1.2 + 1.3 only. TLS 1.2 limited to ECDHE + AEAD suites (forward secrecy, no CBC/RSA-kx).
    # TLS 1.3 suites are fixed by OpenSSL and all strong.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers. All are set here, at server level, and no location below uses add_header,
    # because any add_header inside a location silently drops every one of these.
    # HSTS is ignored by browsers for IP-address hosts (RFC 6797 s8.1.1) and for connections with
    # certificate errors, so it only takes effect once the CA is trusted; no includeSubDomains/preload.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Same-origin only: the browser may not fetch anything from third parties (air-gap).
    # 'unsafe-inline' for styles only, because React style={{...}} props are inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads: keep in step with MAX_UPLOAD_MB (backend default 25).
    client_max_body_size 26m;

    # Backend API, same origin -> no mixed content, no CORS preflight.
    # The trailing slash on proxy_pass strips the /api prefix: /api/login -> /login.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        # Local LLM answers and PDF ingestion can take minutes on a laptop CPU.
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
